<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mobile App Concept — Calorie Tracker</title>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="84" rx="8" fill="#0C0F13"/>
  <circle cx="60" cy="36" r="18" fill="url(#cxgt)"/>
  <text x="60" y="68" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#F2F3F5">App</text>
  <defs><linearGradient id="cxgt" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3A5BFF"/><stop offset="55%" stop-color="#19D3D9"/><stop offset="100%" stop-color="#1FCC74"/></linearGradient></defs>
</svg>
</template>

<!-- Resources referenced from JSX strings — listed so the bundler can find them -->
<meta name="ext-resource-dependency" content="../assets/food/chicken_rice_bowl_highformat.jpg"/>
<meta name="ext-resource-dependency" content="../assets/food/chicken_rice_bowl_square.jpg"/>
<meta name="ext-resource-dependency" content="../assets/food/protein_joghurt.jpg"/>
<meta name="ext-resource-dependency" content="../assets/food/coffee-oatmeal.jpg"/>

<!-- Fonts: Geist + Geist Mono via Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #ECE9E3;
    font-family: "Geist", "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  * { box-sizing: border-box; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Components & screens -->
<script type="text/babel" src="handoff-support.jsx"></script>
<script type="text/babel" src="../src/cx-theme.jsx"></script>
<script type="text/babel" src="../src/cx-icons.jsx"></script>
<script type="text/babel" src="../src/cx-shell.jsx"></script>
<script type="text/babel" src="../src/cx-screen-scan.jsx"></script>
<script type="text/babel" src="../src/cx-screen-states.jsx"></script>
<script type="text/babel" src="../src/cx-screen-processing.jsx"></script>
<script type="text/babel" src="../src/cx-screen-today.jsx"></script>
<script type="text/babel" src="../src/cx-screen-food.jsx"></script>
<script type="text/babel" src="../src/cx-screen-history.jsx"></script>
<script type="text/babel" src="../src/cx-screen-goals.jsx"></script>
<script type="text/babel" src="../src/cx-screen-ai.jsx"></script>
<script type="text/babel" src="../src/cx-screen-ai-history.jsx"></script>
<script type="text/babel" src="../src/cx-screen-loading.jsx"></script>
<script type="text/babel" src="../src/cx-screen-login.jsx"></script>
<script type="text/babel" src="../src/cx-screen-profile.jsx"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

// Lock screen w/ Placeholder app push — supports light + dark.
function CXLockScreen({ mode = 'dark' }) {
  const dark = mode !== 'light';
  const bg = dark
    ? `radial-gradient(70% 60% at 30% 20%, #1a2330 0%, #0a0d12 60%),
       radial-gradient(60% 50% at 80% 80%, #112024 0%, #0a0d12 60%)`
    : `radial-gradient(70% 60% at 30% 20%, #f6efe2 0%, #d9c9a8 50%, #b5a07d 100%),
       radial-gradient(60% 50% at 80% 80%, #e8d3b3 0%, transparent 60%)`;
  // Foreground text reads white on both wallpapers (real iOS lock-screen
  // behaviour over a tan wallpaper).
  const fg = '#FFFFFF';
  const fgDim = 'rgba(255,255,255,0.78)';
  const fgDimmer = 'rgba(255,255,255,0.55)';
  const notifBg = dark ? 'rgba(28,32,38,0.78)' : 'rgba(22,18,12,0.42)';
  const notifBorder = dark ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.20)';
  const notif2Bg = dark ? 'rgba(28,32,38,0.55)' : 'rgba(22,18,12,0.28)';
  const notif2Border = dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.15)';
  return (
    <div style={{
      position: 'relative', width: '100%', height: '100%',
      background: bg,
      overflow: 'hidden', color: fg,
    }}>
      <div style={{ paddingTop: 96, textAlign: 'center' }}>
        <div style={{
          fontFamily: CX_MONO, fontSize: 14, fontWeight: 500,
          color: fgDim, letterSpacing: '0.16em', textTransform: 'uppercase',
          textShadow: dark ? 'none' : '0 1px 12px rgba(0,0,0,0.25)',
        }}>Friday, May 15</div>
        <div style={{
          fontFamily: CX_FONT, fontSize: 96, fontWeight: 200,
          letterSpacing: '-0.04em', lineHeight: 1, marginTop: 4,
          textShadow: dark ? 'none' : '0 2px 24px rgba(0,0,0,0.25)',
        }}>13:04</div>
      </div>

      <div style={{
        position: 'absolute', left: 10, right: 10, top: 360,
        display: 'flex', flexDirection: 'column', gap: 8,
      }}>
        <div style={{
          borderRadius: 22, padding: '12px 14px',
          background: notifBg,
          backdropFilter: 'blur(40px) saturate(160%)',
          WebkitBackdropFilter: 'blur(40px) saturate(160%)',
          border: `0.5px solid ${notifBorder}`,
          boxShadow: '0 12px 30px rgba(0,0,0,0.35)',
          display: 'flex', gap: 10, alignItems: 'flex-start',
        }}>
          <div style={{
            width: 38, height: 38, borderRadius: 9,
            background: dark
              ? 'linear-gradient(145deg, #1a1f28 0%, #0e1118 100%)'
              : 'linear-gradient(145deg, #f0ede7 0%, #e2ded6 100%)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: dark
              ? 'inset 0 0 0 0.5px rgba(255,255,255,0.12)'
              : 'inset 0 0 0 0.5px rgba(11,13,16,0.08)',
            flexShrink: 0,
          }}>
            <CXLogo size={22}/>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
              <span style={{ fontFamily: CX_FONT, fontSize: 13, fontWeight: 600, color: fg }}>{CX_APPNAME}</span>
              <span style={{ fontFamily: CX_MONO, fontSize: 10.5, color: fgDimmer, letterSpacing: '0.06em' }}>now</span>
            </div>
            <div style={{ fontFamily: CX_FONT, fontSize: 13.5, fontWeight: 600, marginTop: 2, color: fg }}>
              Scan complete — Chicken Rice Bowl
            </div>
            <div style={{ fontFamily: CX_FONT, fontSize: 12.5, color: fgDim, marginTop: 1 }}>
              620 kcal · 48P / 72C / 16F · 91% confidence
            </div>
            <div style={{ fontFamily: CX_MONO, fontSize: 10, color: CX.cyan, marginTop: 6, letterSpacing: '0.10em' }}>
              SWIPE TO REVIEW · HOLD TO CONFIRM
            </div>
          </div>
          <div style={{
            width: 44, height: 44, borderRadius: 10, flexShrink: 0,
            overflow: 'hidden',
            border: '0.5px solid rgba(255,255,255,0.10)',
          }}>
            <img src="../assets/food/chicken_rice_bowl_square.jpg" alt="" style={{
              width: '100%', height: '100%', objectFit: 'cover', display: 'block',
            }}/>
          </div>
        </div>

        <div style={{
          margin: '0 8px', borderRadius: 18, padding: '10px 14px',
          background: notif2Bg,
          backdropFilter: 'blur(28px)', WebkitBackdropFilter: 'blur(28px)',
          border: `0.5px solid ${notif2Border}`,
          display: 'flex', gap: 10, alignItems: 'center',
          opacity: 0.95,
        }}>
          <div style={{
            width: 28, height: 28, borderRadius: 7, background: '#1F1F1F',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: CX_FONT, fontWeight: 700, fontSize: 13, color: '#fff',
          }}>SC</div>
          <div style={{ flex: 1, fontFamily: CX_FONT, fontSize: 12.5, color: fgDim }}>
            2 more notifications
          </div>
        </div>
      </div>

      <div style={{
        position: 'absolute', bottom: 70, left: 0, right: 0,
        display: 'flex', justifyContent: 'space-between', padding: '0 36px',
      }}>
        <div style={{
          width: 50, height: 50, borderRadius: 999,
          background: 'rgba(255,255,255,0.18)',
          backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <CXIcon name="flash" size={20} color={fg}/>
        </div>
        <div style={{
          width: 50, height: 50, borderRadius: 999,
          background: 'rgba(255,255,255,0.18)',
          backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <CXIcon name="lens" size={20} color={fg}/>
        </div>
      </div>
    </div>
  );
}

function Frame({ children, dark = false }) {
  return (
    <IOSDevice width={402} height={874} dark={dark}>
      {children}
    </IOSDevice>
  );
}

// One global mode controls light/dark across every theme-aware screen.
// Camera + processing + lock-screen artboards stay dark by design (they are
// camera/system surfaces); everything else follows `mode`.
const DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "dark",
  "scanState": "idle",
  "foodEdit": false,
  "historyView": "week",
  "todayState": "logged",
  "goalsPeriod": "idle"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(DEFAULTS);
  const dark = tw.mode === 'dark';

  return (
    <>
      <DesignCanvas>
        <DCSection id="brand" title="Identity" subtitle="A faster, free alternative — camera-first calorie tracking. Atelier-athletic system. Name + logo TBD.">
          <DCArtboard id="brand-card" label="Identity" width={402} height={874}>
            <BrandCard mode={tw.mode}/>
          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="App entry · loading, sign-in, profile" subtitle="What the user sees before and around the camera. Follows the global Mode tweak.">
          <DCArtboard id="loading" label={`Loading · ${tw.mode}`} width={402} height={874}>
            <Frame dark={dark}><CXLoadingScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="login" label={`Login · ${tw.mode}`} width={402} height={874}>
            <Frame dark={dark}><CXLoginScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="profile" label={`Profile · ${tw.mode}`} width={402} height={874}>
            <Frame dark={dark}><CXProfileScreen mode={tw.mode}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="capture" title="Camera & capture flow" subtitle="Default landing screen. Open app → frame → tap → cloud → push notification.">
          <DCArtboard id="permission" label="00 · Camera permission" width={402} height={874}>
            <Frame dark={dark}><CXPermissionScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="scan" label="01 · Scan · idle / capturing" width={402} height={874}>
            <Frame dark={dark}><CXScanScreen state={tw.scanState} mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="processing" label="02 · Processing card" width={402} height={874}>
            <Frame dark={dark}><CXProcessingScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="lock-notif" label={`03 · Lock-screen push · ${tw.mode}`} width={402} height={874}>
            <Frame dark={dark}><CXLockScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="review" label="04 · Low confidence · review" width={402} height={874}>
            <Frame dark={dark}><CXScanReviewScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="manual" label="05 · Manual add · fallback" width={402} height={874}>
            <Frame dark={dark}><CXManualAddScreen mode={tw.mode}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="today" title="Today dashboard" subtitle="Hero macro ring on top of a card, then macro sub-cards. Entry animation fills + counts up.">
          <DCArtboard id="today" label={`Today · ${tw.todayState}`} width={402} height={874}>
            <Frame dark={dark}><CXTodayScreen mode={tw.mode} empty={tw.todayState === 'empty'}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="food" title="Food detail · edit · CRUD" subtitle="Hero, editable nutrition, detected items, AI fix. Toggle original / edit state.">
          <DCArtboard id="food" label={`Food detail · ${tw.foodEdit ? 'editing' : 'original'}`} width={402} height={874}>
            <Frame dark={dark}><CXFoodDetailScreen mode={tw.mode} editing={tw.foodEdit}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="long" title="History & Goals" subtitle="Long-term progress and a motivational, data-driven plan.">
          <DCArtboard id="history" label={`History · ${tw.historyView}`} width={402} height={874}>
            <Frame dark={dark}><CXHistoryScreen mode={tw.mode} view={tw.historyView}/></Frame>
          </DCArtboard>
          <DCArtboard id="goals" label={`Goals · ${tw.goalsPeriod === 'select' ? 'period select' : 'idle'}`} width={402} height={874}>
            <Frame dark={dark}><CXGoalsScreen mode={tw.mode} period={tw.goalsPeriod}/></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection id="ai" title="Assistant" subtitle="Integrated AI that can edit your meals and macro plan with confirmation.">
          <DCArtboard id="ai-history" label="Chat history" width={402} height={874}>
            <Frame dark={dark}><CXAIHistoryScreen mode={tw.mode}/></Frame>
          </DCArtboard>
          <DCArtboard id="ai" label="AI chat" width={402} height={874}>
            <Frame dark={dark}><CXAIScreen mode={tw.mode}/></Frame>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakRadio
            label="App mode"
            value={tw.mode}
            onChange={(v) => setTweak('mode', v)}
            options={[
              { value: 'light', label: 'Light' },
              { value: 'dark',  label: 'Dark' },
            ]}
          />
        </TweakSection>
        <TweakSection label="Today">
          <TweakRadio
            label="State"
            value={tw.todayState}
            onChange={(v) => setTweak('todayState', v)}
            options={[
              { value: 'logged', label: 'Logged' },
              { value: 'empty',  label: 'Empty' },
            ]}
          />
        </TweakSection>
        <TweakSection label="Camera">
          <TweakRadio
            label="Scan state"
            value={tw.scanState}
            onChange={(v) => setTweak('scanState', v)}
            options={[
              { value: 'idle',      label: 'Idle' },
              { value: 'capturing', label: 'Capture' },
            ]}
          />
        </TweakSection>
        <TweakSection label="Food detail">
          <TweakRadio
            label="State"
            value={tw.foodEdit ? 'edit' : 'original'}
            onChange={(v) => setTweak('foodEdit', v === 'edit')}
            options={[
              { value: 'original', label: 'Original' },
              { value: 'edit',     label: 'Editing' },
            ]}
          />
        </TweakSection>
        <TweakSection label="History">
          <TweakRadio
            label="Calendar view"
            value={tw.historyView}
            onChange={(v) => setTweak('historyView', v)}
            options={[
              { value: 'week',  label: 'Week' },
              { value: 'month', label: 'Month' },
            ]}
          />
        </TweakSection>
        <TweakSection label="Goals">
          <TweakRadio
            label="Period selector"
            value={tw.goalsPeriod}
            onChange={(v) => setTweak('goalsPeriod', v)}
            options={[
              { value: 'idle',   label: 'Idle' },
              { value: 'select', label: 'Selecting' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// Brand identity card — supports light + dark.
function BrandCard({ mode = 'dark' }) {
  const dark = mode === 'dark';
  const bg   = dark ? '#0B0D10' : '#F4F2EE';
  const ink  = dark ? '#F2F3F5' : '#0B0D10';
  const ink2 = dark ? 'rgba(242,243,245,0.65)' : 'rgba(11,13,16,0.55)';
  const ink3 = dark ? 'rgba(242,243,245,0.45)' : 'rgba(11,13,16,0.40)';
  const tileBg = dark ? 'rgba(255,255,255,0.04)' : '#FFFFFF';
  const tileBorder = dark ? 'rgba(255,255,255,0.08)' : 'rgba(11,13,16,0.06)';

  return (
    <div style={{
      width: '100%', height: '100%',
      background: bg, color: ink,
      fontFamily: CX_FONT,
      padding: '54px 24px 100px',
      display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'hidden',
    }}>
      <div style={{
        position: 'absolute', right: -120, top: -120, width: 380, height: 380, borderRadius: 999,
        background: dark
          ? 'radial-gradient(closest-side, rgba(25,211,217,0.22), transparent)'
          : 'radial-gradient(closest-side, rgba(25,211,217,0.32), transparent)',
        filter: 'blur(20px)',
      }}/>
      <div style={{
        position: 'absolute', left: -120, bottom: 120, width: 320, height: 320, borderRadius: 999,
        background: dark
          ? 'radial-gradient(closest-side, rgba(58,91,255,0.18), transparent)'
          : 'radial-gradient(closest-side, rgba(58,91,255,0.20), transparent)',
        filter: 'blur(20px)',
      }}/>

      <div style={{ position: 'relative', zIndex: 2 }}>
        <CXLabel color={ink2}>Mobile · iOS · Flutter-ready</CXLabel>
        <div style={{ marginTop: 18 }}>
          <CXWordmark height={48} mode={mode}/>
          <div style={{ fontFamily: CX_MONO, fontSize: 11, marginTop: 10, color: ink2, letterSpacing: '0.18em', textTransform: 'uppercase' }}>
            Snap · Track · Stay on target
          </div>
        </div>

        <div style={{ marginTop: 36, fontSize: 18, lineHeight: 1.45, letterSpacing: '-0.01em', maxWidth: 320 }}>
          Open the app. The camera is already on.<br/>
          One tap. We process in the cloud. A push tells you when it's logged.
        </div>
      </div>

      <div style={{ marginTop: 'auto', position: 'relative', zIndex: 2 }}>
        <CXLabel color={ink3} style={{ marginBottom: 10 }}>Macro palette</CXLabel>
        <div style={{ display: 'flex', gap: 10 }}>
          {[
            { c: CX.blue,  l: 'PROTEIN' },
            { c: CX.cyan,  l: 'CARBS'   },
            { c: CX.green, l: 'FAT'     },
          ].map((s) => (
            <div key={s.l} style={{
              flex: 1, padding: 12, borderRadius: 14,
              background: tileBg,
              border: `0.5px solid ${tileBorder}`,
            }}>
              <div style={{ width: 24, height: 24, borderRadius: 8, background: s.c }}/>
              <div style={{
                fontFamily: CX_MONO, fontSize: 9.5, color: ink2,
                letterSpacing: '0.14em', marginTop: 8,
              }}>{s.l}</div>
              <div style={{ fontFamily: CX_MONO, fontSize: 10, color: ink3, marginTop: 2 }}>
                {s.c.toUpperCase()}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
