name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Prepare release inputs
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          chmod +x tool/ci/prepare_android_release.sh
          tool/ci/prepare_android_release.sh prepare --root "$GITHUB_WORKSPACE"

      - name: Build release APK
        run: |
          fvm install
          fvm flutter pub get
          fvm flutter build apk --release

      - name: Verify release signing certificate
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1):$PATH"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          RAW_CERT="$(apksigner verify --print-certs "$APK_PATH" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          NORMALIZED_ACTUAL="$(printf '%s' "$RAW_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          NORMALIZED_EXPECTED="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [ -z "$NORMALIZED_ACTUAL" ] || [ "$NORMALIZED_ACTUAL" != "$NORMALIZED_EXPECTED" ]; then
            echo "Release signing certificate fingerprint check failed" >&2
            exit 1
          fi
          tool/ci/prepare_android_release.sh verify-fingerprint --expected "$NORMALIZED_EXPECTED" --actual "$NORMALIZED_ACTUAL"

      - name: Prepare distributable files
        run: |
          mkdir -p dist
          APP_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          APK_NAME="calorix-${APP_VERSION}-android-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: Clean up release inputs
        if: always()
        run: |
          tool/ci/prepare_android_release.sh cleanup --root "$GITHUB_WORKSPACE" || true
          rm -f android/key.properties
          rm -f android/app/google-services.json
          rm -f ios/Runner/GoogleService-Info.plist
          rm -f lib/core/firebase/firebase_options.dart
          rm -f android/app/release.jks

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: android-apk-${{ github.sha }}
          path: dist

      - name: Publish release assets for tags
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
