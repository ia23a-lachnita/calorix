name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Ensure Firebase options file exists
        run: |
          if [ ! -f lib/core/firebase/firebase_options.dart ]; then
            mkdir -p lib/core/firebase
            cat > lib/core/firebase/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/foundation.dart'
              show TargetPlatform, defaultTargetPlatform, kIsWeb;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                case TargetPlatform.macOS:
                  return macos;
                case TargetPlatform.windows:
                  return windows;
                case TargetPlatform.linux:
                  return linux;
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: 'ci-placeholder-api-key',
              appId: '1:000000000000:web:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder-project',
              authDomain: 'ci-placeholder-project.firebaseapp.com',
              storageBucket: 'ci-placeholder-project.firebasestorage.app',
            );

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'ci-placeholder-api-key',
              appId: '1:000000000000:android:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder-project',
              storageBucket: 'ci-placeholder-project.firebasestorage.app',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'ci-placeholder-api-key',
              appId: '1:000000000000:ios:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder-project',
              storageBucket: 'ci-placeholder-project.firebasestorage.app',
              iosBundleId: 'com.calorix.calorix',
            );

            static const FirebaseOptions macos = FirebaseOptions(
              apiKey: 'ci-placeholder-api-key',
              appId: '1:000000000000:ios:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder-project',
              storageBucket: 'ci-placeholder-project.firebasestorage.app',
              iosBundleId: 'com.calorix.calorix',
            );

            static const FirebaseOptions windows = FirebaseOptions(
              apiKey: 'ci-placeholder-api-key',
              appId: '1:000000000000:web:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder-project',
              authDomain: 'ci-placeholder-project.firebaseapp.com',
              storageBucket: 'ci-placeholder-project.firebasestorage.app',
            );

            static const FirebaseOptions linux = FirebaseOptions(
              apiKey: 'ci-placeholder-api-key',
              appId: '1:000000000000:web:0000000000000000',
              messagingSenderId: '000000000000',
              projectId: 'ci-placeholder-project',
              authDomain: 'ci-placeholder-project.firebaseapp.com',
              storageBucket: 'ci-placeholder-project.firebasestorage.app',
            );
          }
          EOF
          fi

      - name: Build release APK
        run: |
          fvm install
          fvm flutter pub get
          fvm flutter build apk --release

      - name: Prepare distributable files
        run: |
          mkdir -p dist
          APP_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          APK_NAME="calorix-${APP_VERSION}-android-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" > "dist/${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: dist/*
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: android-apk-${{ github.sha }}
          path: dist

      - name: Publish release assets for tags
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
