name: Android Emulator Runtime Evidence

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Activate FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install pinned Flutter SDK via FVM
        run: fvm install

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Build instrumented debug APK
        run: fvm flutter build apk --debug --target integration_test/e2e/e2e_matrix_test.dart

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "34"
          target: google_apis
          arch: x86_64
          profile: "Nexus 6"
          emulator-port: "5554"
          script: |
            set +e
            fvm flutter drive --driver=test_driver/integration_test.dart --target=integration_test/e2e/e2e_matrix_test.dart -d emulator-5554 --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk --no-build
            DRIVE_EXIT=$?
            mkdir -p .runtime_evidence/github
            adb -s emulator-5554 exec-out screencap -p > .runtime_evidence/github/screenshot.png
            adb -s emulator-5554 logcat -d > .runtime_evidence/github/logcat.txt
            adb -s emulator-5554 shell getprop ro.build.version.sdk > .runtime_evidence/github/sdk-version.txt
            adb -s emulator-5554 shell getprop ro.product.model > .runtime_evidence/github/device-model.txt
            adb -s emulator-5554 shell wm size > .runtime_evidence/github/viewport.txt
            sha256sum build/app/outputs/flutter-apk/app-debug.apk > .runtime_evidence/github/apk.sha256
            git rev-parse HEAD > .runtime_evidence/github/source-commit.txt
            exit "$DRIVE_EXIT"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: emulator-run-${{ github.sha }}
          path: .runtime_evidence/github/
          retention-days: 30
          if-no-files-found: warn
