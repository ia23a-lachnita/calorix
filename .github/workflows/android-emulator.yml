name: Android Emulator Runtime Evidence

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Activate FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install pinned Flutter SDK via FVM
        run: fvm install

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Build instrumented debug APK
        run: fvm flutter build apk --debug --target integration_test/e2e/e2e_matrix_test.dart

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "34"
          target: google_apis
          arch: x86_64
          profile: "Nexus 6"
          emulator-port: "5554"
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash tool/ci/run_android_emulator_evidence.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: emulator-run-${{ github.sha }}
          path: .runtime_evidence/github/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
