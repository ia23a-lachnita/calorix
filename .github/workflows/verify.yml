name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Verification scope (all is required for APK builds)'
        type: choice
        options: [all, tier1]
        default: all

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: fvm install

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Verify PowerShell available
        run: pwsh --version

      - name: Run tests
        run: |
          if [ "${{ inputs.scope }}" = "tier1" ]; then
            fvm flutter test test/tier1 --reporter expanded
          else
            fvm flutter test --reporter compact
          fi

      - name: Analyze Tier1 feature
        run: fvm flutter analyze lib/features/tier1 test/tier1

  functions:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'tier1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Test weighed-meal evaluator
        run: python3 -m unittest discover -s tests -p test_evaluate_meals.py

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Lint
        working-directory: functions
        run: npm run lint

      - name: Test
        working-directory: functions
        run: npm test
