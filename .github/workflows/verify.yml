name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: fvm install

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Verify PowerShell available
        run: pwsh --version

      - name: Run tests
        run: fvm flutter test --reporter compact

      - name: Analyze Tier1 feature
        run: fvm flutter analyze lib/features/tier1 test/tier1

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/public-eval-requirements.txt

      - name: Install public image preprocessing dependency
        run: python3 -m pip install -r tool/public-eval-requirements.txt

      - name: Test meal evaluation and public data preparation
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test frozen public evaluation guards
        run: node --test tool/frozen_public_eval.test.cjs

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Lint
        working-directory: functions
        run: npm run lint

      - name: Test
        working-directory: functions
        run: npm test
